[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tunix-football-digital-twin"
version = "0.1.0"
description = "Temporal football intelligence, digital twin and probabilistic world simulation engine by TUNIX."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "TUNIX" }]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3",
  "asyncpg>=0.29,<1",
  "alembic>=1.13,<2",
  "httpx>=0.27,<1",
  "polars>=1.7,<2",
  "numpy>=2.1,<3",
  "scipy>=1.14,<2",
]

[project.optional-dependencies]
modeling = [
  "scikit-learn>=1.5,<2",
  "pymc>=5.16,<6",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tunix_football"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["tunix_football"]
