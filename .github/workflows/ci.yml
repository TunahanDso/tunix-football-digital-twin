name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tunix
          POSTGRES_PASSWORD: tunix
          POSTGRES_DB: tunix_football
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tunix -d tunix_football"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://tunix:tunix@localhost:5432/tunix_football
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy src/tunix_football

      - name: Migrate empty PostgreSQL database
        run: alembic upgrade head

      - name: Pytest
        run: pytest -q
